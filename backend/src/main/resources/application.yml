server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cryptocinema-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptocinema}
    username: ${DB_USERNAME:cryptocinema}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:3600000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  crypto:
    merchant-address: ${CRYPTO_MERCHANT_ADDRESS:}
    eth-rsd-rate: ${ETH_RSD_RATE:350000}
    web3-rpc-url: ${WEB3_RPC_URL:}
    network: Sepolia
    chain-id: 11155111
