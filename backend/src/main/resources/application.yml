server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cryptocinema-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptocinema}
    username: ${DB_USERNAME:cryptocinema}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
